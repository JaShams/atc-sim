<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATC Trace Replay Viewer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <h1>ATC Benchmark Replay Viewer</h1>
    <section class="panel controls">
      <label>Trace JSONL <input id="traceFile" type="file" accept=".jsonl,.txt,application/json" /></label>
      <label>Score JSON <input id="scoreFile" type="file" accept=".json,application/json" /></label>
      <div id="loadStatus">Load a trace file to begin. Score file optional.</div>
    </section>

    <section class="panel">
      <canvas id="radar" width="900" height="560"></canvas>
      <div class="timeline-row">
        <button id="stepBack" type="button" disabled aria-label="Previous tick">&lt;</button>
        <button id="playPause" type="button" disabled>Play</button>
        <button id="stepForward" type="button" disabled aria-label="Next tick">&gt;</button>
        <label for="tickSlider">Tick</label>
        <input id="tickSlider" type="range" min="0" max="0" value="0" disabled />
        <span id="tickLabel">0 / 0</span>
        <label for="playSpeed">Speed</label>
        <select id="playSpeed">
          <option value="1000">1x</option>
          <option value="500">2x</option>
          <option value="250">4x</option>
        </select>
      </div>
    </section>

    <section class="grid">
      <article class="panel" id="scorePanel"></article>
      <article class="panel" id="tickPanel"></article>
    </section>
  </main>
  <script src="./viewer.js"></script>
</body>
</html>
