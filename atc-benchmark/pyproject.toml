[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-benchmark"
version = "0.1.0"
description = "ATC-inspired simulation benchmark"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=7.4",
    "ruff>=0.3",
]
live = [
    "uvicorn[standard]>=0.23",
]

[project.scripts]
atc-run = "atc_benchmark.runner.run_scenario:main"
atc-batch = "atc_benchmark.runner.batch_evaluate:main"
atc-validate = "atc_benchmark.runner.validate_scenarios:main"
atc-motif = "atc_benchmark.runner.analyze_motifs:main"
atc-ingest = "atc_benchmark.runner.ingest_scenario:main"
atc-live = "atc_benchmark.runner.live_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
