[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-benchmark"
version = "0.1.0"
description = "ATC-inspired simulation benchmark"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
atc-run = "atc_benchmark.runner.run_scenario:main"
atc-batch = "atc_benchmark.runner.batch_evaluate:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
